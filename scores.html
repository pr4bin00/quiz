<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My readiness score, SOC 2 and ISO 27001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=Newsreader:opsz,wght@6..72,300..500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ecedf6; --plate:#ffffff; --plate-2:#f5f6fc; --sunk:#dfe2f0;
  --ink:#131829; --mid:#575f7d; --faint:#8a92ad;
  --rule:#d8dcec; --rule-2:#bec4dc;
  --accent:#2f3aa3; --accent-2:#4c57c9; --soft:#e8eafb; --on-accent:#ffffff; --tintline:#cdd3f0;
  --pick:#1e7a4c; --on-pick:#ffffff; --pick-soft:#e0f2e7; --pick-line:#b5dcc6;
  --live:#b06a12; --live-soft:#f7ecd8;
  --sans:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',Times,serif;
  --lift:0 1px 2px rgba(19,24,41,.05), 0 10px 30px -18px rgba(19,24,41,.3);
}
:root[data-theme="dark"]{
  --bg:#0d1020; --plate:#171b2e; --plate-2:#1d2239; --sunk:#242a44;
  --ink:#e9ebf6; --mid:#a0a7c4; --faint:#767d9c;
  --rule:#262b45; --rule-2:#3a4161;
  --accent:#8e97ff; --accent-2:#a4abff; --soft:#222a50; --on-accent:#0d1020; --tintline:#39406b;
  --pick:#2f9c63; --on-pick:#04170d; --pick-soft:#16301f; --pick-line:#2c5a3c;
  --live:#f0b93b; --live-soft:#2e2717;
  --lift:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -20px rgba(0,0,0,.8);
}
:root[data-theme="dark"] .brand img{background:#fff;padding:4px 7px;border-radius:7px}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;
  line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

.fig{font-stretch:118%;font-weight:700;letter-spacing:-.035em;font-feature-settings:"tnum" 1}
.shell{max-width:880px;margin:0 auto;padding:0 clamp(18px,5vw,34px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* masthead */
.mast{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.mast .shell{display:flex;align-items:center;gap:8px;height:58px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;text-decoration:none;color:var(--ink);
  min-width:0;border-radius:8px}
.brand img{height:30px;width:auto;display:block;flex:none}
.brand span{font-weight:600;font-size:.9rem;letter-spacing:-.012em;white-space:nowrap}
.links{display:flex;gap:2px}
.links a{text-decoration:none;color:var(--mid);font-size:.84rem;font-weight:500;padding:6px 13px;
  border-radius:99px;transition:background .15s,color .15s}
.links a:hover{background:var(--plate-2);color:var(--ink)}
.links a[aria-current]{background:var(--accent);color:var(--on-accent)}
.theme{display:grid;place-items:center;width:32px;height:32px;margin-left:6px;background:none;
  border:1px solid var(--rule-2);border-radius:99px;cursor:pointer;color:var(--mid)}
.theme:hover{background:var(--plate-2);color:var(--ink)}
.theme svg{width:15px;height:15px;display:block}

/* type */
.display{font-family:var(--serif);font-weight:350;font-variation-settings:"opsz" 72;
  font-size:clamp(2.1rem,5vw,3.35rem);line-height:1.04;letter-spacing:-.02em;margin:0 0 16px;max-width:17ch}
.lede{font-family:var(--serif);font-size:1.08rem;line-height:1.6;color:var(--mid);max-width:54ch;
  margin:0 0 26px;font-variation-settings:"opsz" 16}
.muted{color:var(--mid)}
.sm{font-size:.84rem}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:9px;cursor:pointer;background:var(--accent);
  color:var(--on-accent);border:none;padding:12px 24px;border-radius:99px;font-weight:600;font-size:.92rem;
  text-decoration:none;transition:transform .14s cubic-bezier(.2,.8,.3,1),background .14s}
.btn:hover{transform:translateY(-1px);background:var(--accent-2)}
.btn[disabled]{opacity:.3;cursor:not-allowed;transform:none;background:var(--accent)}
.btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-2)}
.btn-line:hover{background:var(--plate-2)}
.btn-sm{padding:9px 18px;font-size:.84rem}
.arw{width:14px;height:14px;flex:none}

/* name gate */
.gate{background:var(--plate);border-radius:18px;padding:clamp(20px,3vw,26px);box-shadow:var(--lift);
  margin-bottom:8px;display:grid;gap:14px}
.gate h2{margin:0;font-size:1.05rem;font-weight:600;letter-spacing:-.014em}
.gate p{margin:0;font-size:.86rem;color:var(--mid);max-width:50ch}
.gate-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.inp{background:transparent;border:none;border-bottom:1.5px solid var(--rule-2);padding:7px 2px;
  font:inherit;font-size:1.05rem;color:var(--ink);border-radius:0;min-width:230px;flex:1;
  transition:border-color .16s}
.inp::placeholder{color:var(--faint)}
.inp:focus{outline:none;border-bottom-color:var(--accent)}
.who{display:flex;align-items:center;gap:10px;font-size:.86rem;color:var(--mid);
  padding:13px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:6px}
.who b{color:var(--ink);font-weight:600}
.who .dot{width:7px;height:7px;border-radius:50%;background:var(--live);flex:none;
  box-shadow:0 0 0 3px var(--live-soft)}
.linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:.82rem;
  font-weight:600;padding:4px 8px;border-radius:99px;margin-left:auto}
.linkbtn:hover{background:var(--soft)}

/* question cards */
.qs{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:10px}
.qs.locked{opacity:.62}
.q{background:var(--plate);border:1px solid var(--rule);border-radius:14px;
  transition:border-color .2s,box-shadow .2s}
.q:hover{border-color:var(--rule-2)}
.q.done{border-color:var(--pick-line);box-shadow:inset 3px 0 0 var(--pick)}
.q.open:not(.done){border-color:var(--tintline)}
.qhead{width:100%;display:grid;grid-template-columns:26px 1fr 18px;gap:0 14px;align-items:start;
  background:none;border:none;padding:17px 18px;cursor:pointer;text-align:left;border-radius:13px}
.n{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:.74rem;
  font-weight:700;font-stretch:112%;color:var(--faint);background:var(--plate-2);
  box-shadow:inset 0 0 0 1px var(--rule);margin-top:1px;flex:none;
  transition:background .25s,color .25s,box-shadow .25s}
.q.done .n{background:var(--pick-soft);color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick-line)}
.qmain{min-width:0}
.ask{font-family:var(--serif);font-weight:350;font-variation-settings:"opsz" 32;
  font-size:clamp(1.05rem,2.1vw,1.3rem);line-height:1.34;letter-spacing:-.01em;margin:0;display:block}
.picked{display:none;margin-top:8px}
.q.done:not(.open) .picked{display:block}
.q.done:not(.open) .ask{color:var(--mid)}
.ptxt{font-size:.88rem;line-height:1.3;color:var(--pick);font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.chev{width:18px;height:18px;color:var(--faint);margin-top:5px;flex:none;
  transition:transform .32s cubic-bezier(.2,.8,.3,1)}
.q.open .chev{transform:rotate(180deg)}

.qbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.8,.3,1)}
.q.open .qbody{grid-template-rows:1fr}
.qbody>div{overflow:hidden;visibility:hidden;transition:visibility 0s .32s}
.q.open .qbody>div{visibility:visible;transition:visibility 0s}

.opts{list-style:none;margin:0;padding:0 18px 18px 58px;display:grid;gap:6px}
.opt{position:relative}
.opt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:2}
.face{display:block;background:var(--plate-2);padding:12px 16px;border-radius:10px;font-size:.94rem;
  line-height:1.32;pointer-events:none;box-shadow:inset 0 0 0 1px var(--rule);
  transition:box-shadow .14s,background .16s,color .16s,transform .16s cubic-bezier(.2,.8,.3,1)}
.opt:hover .face{box-shadow:inset 0 0 0 1px var(--rule-2);transform:translateX(3px)}
.opt input:focus-visible+.face{outline:2px solid var(--accent);outline-offset:3px}
/* selected: the whole option turns green */
.opt.on .face{background:var(--pick);color:var(--on-pick);box-shadow:none;transform:translateX(3px)}

.end{padding:32px 0 44px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.end .note{font-size:.84rem;color:var(--mid)}
.reset{background:none;border:none;color:var(--faint);font-size:.82rem;cursor:pointer;
  padding:6px 12px;border-radius:99px;margin-left:auto}
.reset:hover{color:var(--ink);background:var(--plate-2)}

/* live progress bar */
.bar{position:sticky;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--rule)}
.bar .shell{display:flex;align-items:center;gap:clamp(14px,4vw,28px);padding-top:12px;padding-bottom:13px}
.tally{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.tally b{font-size:2rem;line-height:.9}
.tally span{font-size:.78rem;color:var(--mid)}
.prog{flex:1;min-width:0}
.prog span{display:block;font-size:.74rem;color:var(--mid);margin-bottom:6px}
.line{height:3px;background:var(--sunk);border-radius:99px;overflow:hidden}
.line i{display:block;height:100%;width:0;background:var(--pick);border-radius:99px;
  transition:width .4s cubic-bezier(.2,.8,.3,1)}

/* result */
.res{padding:clamp(34px,8vh,70px) 0 70px}
.bignum{font-size:clamp(5rem,17vw,9rem);line-height:.8;display:block;color:var(--pick)}
.bignum em{font-style:normal;font-size:.3em;color:var(--mid);letter-spacing:-.01em;margin-left:.12em}
.bigsub{display:block;font-size:.9rem;color:var(--mid);margin-top:14px}
.ladder{margin:30px 0 0;max-width:680px}
.ladder .stops{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:9px}
.ladder .stop{display:flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;color:var(--faint);
  transition:color .2s;min-width:0}
.ladder .stop b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-size:.62rem;font-weight:700;background:var(--sunk);color:var(--mid)}
.ladder .stop span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ladder .stop.hit{color:var(--ink)}
.ladder .stop.hit b{background:var(--pick);color:#fff}
.ladder .track{position:relative;height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.ladder .track i{display:block;height:100%;background:var(--pick);border-radius:99px}
.ladder .marker{position:relative;height:30px;margin-top:8px}
.ladder .pill{position:absolute;top:0;transform:translateX(-50%);background:var(--pick);color:#fff;
  font-size:.76rem;font-weight:700;font-stretch:112%;padding:3px 11px;border-radius:99px;white-space:nowrap}
.ladder .pill::before{content:"";position:absolute;top:-7px;left:50%;margin-left:-4px;
  border:4px solid transparent;border-bottom-color:var(--pick)}
.standing{margin:26px 0 0;padding:20px 22px;background:var(--pick-soft);border:1px solid var(--pick-line);
  border-radius:14px;max-width:680px}
.standing h2{margin:0 0 6px;font-size:1.05rem;font-weight:700;letter-spacing:-.014em;color:var(--pick)}
.standing p{margin:0;font-size:.93rem;line-height:1.55;color:var(--ink)}
.standing p+p{margin-top:11px}
.scale{margin:26px 0 0;max-width:420px}
.scale .segs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.scale .segs i{height:9px;border-radius:99px;background:var(--sunk);position:relative;overflow:hidden}
.scale .segs i b{position:absolute;inset:0;width:0;background:var(--pick);border-radius:99px;display:block}
.scale .ticks{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}
.scale .ticks span{font-size:.68rem;color:var(--faint);text-align:center;font-stretch:112%;font-weight:600}
.scale .ticks:has(span:only-child){grid-template-columns:1fr}
.scale .ticks span:only-child{text-align:left}
.contact{margin:56px 0 0;padding:28px clamp(20px,3vw,32px);background:var(--plate);border:1px solid var(--rule);
  border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.contact-copy{min-width:0;max-width:56ch}
.contact-copy h2{margin:0 0 7px;font-size:1.05rem;font-weight:700;letter-spacing:-.014em;color:var(--ink)}
.contact p{margin:0;font-size:.92rem;line-height:1.5;color:var(--mid)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:32px 0 0}
.review{list-style:none;margin:46px 0 0;padding:0;border-top:1px solid var(--rule)}
.review li{display:grid;grid-template-columns:26px 1fr auto;gap:16px;align-items:baseline;
  padding:14px 0;border-bottom:1px solid var(--rule)}
.review .n2{font-size:.76rem;font-weight:700;font-stretch:112%;color:var(--faint)}
.review .qt{font-size:.9rem;line-height:1.35}
.review .at{display:block;font-family:var(--serif);font-size:.95rem;color:var(--mid);margin-top:3px;
  font-variation-settings:"opsz" 14}
.review .s{font-size:.78rem;font-weight:700;font-stretch:112%;color:var(--pick);
  background:var(--pick-soft);box-shadow:inset 0 0 0 1px var(--pick-line);border-radius:99px;padding:3px 11px}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:90;background:var(--ink);
  color:var(--bg);padding:11px 22px;border-radius:99px;font-size:.85rem;font-weight:500}

@media (max-width:640px){
  .opts{padding:0 14px 16px 14px}
  .qhead{grid-template-columns:24px 1fr 16px;gap:0 11px;padding:15px 14px}
  .tally b{font-size:1.6rem}
  .review li{grid-template-columns:22px 1fr auto;gap:12px}
}
</style>
</head>
<body>

<header class="mast">
  <div class="shell">
    <a class="brand" id="brand" href="https://www.genesesolution.com/" target="_blank" rel="noopener">
      <img id="logo" src="https://www.genesesolution.com/wp-content/uploads/2020/05/logo-genese.svg"
           alt="Genese Solution" height="30"
           onerror="this.remove();var t=document.getElementById('brandtext');if(t)t.hidden=false;">
      <span id="brandtext" hidden>Genese Solution</span>
    </a>
    <nav class="links">
      <a href="index.html" id="nav-a">Assessment</a>
      <a href="scores.html" id="nav-b" aria-current="page">My score</a>
    </nav>
    <button class="theme" id="theme" title="Colour scheme" aria-label="Colour scheme"></button>
  </div>
</header>

<div class="shell"><div class="res" id="app"></div></div>

<script src="config.js"></script>
<script>
(function(){
"use strict";

/* Settings come from config.js. Edit that file, not this one. */
var CONFIG = Object.assign(
  { endpoint:"", quizUrl:"index.html", scoresUrl:"scores.html" },
  window.QUIZ_CONFIG || {}
);

/* ---------- logo ----------
   The logo is hardcoded in the <img> above so the browser starts fetching it
   immediately, before any JavaScript runs. Everything below is optional
   override: it only changes things if you set them in config.js.            */
(function(){
  var a=document.getElementById("brand"), img=document.getElementById("logo"), txt=document.getElementById("brandtext");
  if(CONFIG.logoLink!==undefined) a.setAttribute("href",CONFIG.logoLink||"#");
  if(!a.getAttribute("href")||a.getAttribute("href")==="#"){ a.removeAttribute("target"); a.removeAttribute("rel"); }
  if(!img) return;                                    /* already failed and removed itself */
  if(CONFIG.logoAlt) img.alt=CONFIG.logoAlt;
  if(CONFIG.logoHeight) img.style.height=CONFIG.logoHeight;
  /* empty logoUrl means "keep whatever is in the HTML", so leave it alone */
  if(CONFIG.logoUrl && CONFIG.logoUrl!==img.getAttribute("src")) img.src=CONFIG.logoUrl;
})();

/* ---------- theme ---------- */
var THEMES=["light","dark"], K_THEME="mc.theme";
var GLYPH={
 light:'<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.3" stroke="currentColor" stroke-width="1.5"/><path d="M8 .8v1.8M8 13.4v1.8M15.2 8h-1.8M2.6 8H.8M13.1 13.1l-1.3-1.3M4.2 4.2 2.9 2.9M13.1 2.9l-1.3 1.3M4.2 11.8l-1.3 1.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
 dark:'<svg viewBox="0 0 16 16" fill="none"><path d="M13.6 9.9A6 6 0 0 1 6.1 2.4a6 6 0 1 0 7.5 7.5z" fill="currentColor"/></svg>'
};
var theme="light";                                  /* light is the default */
try{ var tv=localStorage.getItem(K_THEME); if(THEMES.indexOf(tv)>-1) theme=tv; }catch(e){}
function applyTheme(){
  document.documentElement.setAttribute("data-theme",theme);   /* always explicit */
  var b=document.getElementById("theme"), next=(theme==="light"?"dark":"light");
  b.innerHTML=GLYPH[theme];
  b.title="Switch to "+next+" mode";
  b.setAttribute("aria-label","Switch to "+next+" mode");
}
applyTheme();
document.getElementById("theme").addEventListener("click",function(){
  theme=(theme==="light"?"dark":"light");
  try{ localStorage.setItem(K_THEME,theme); }catch(e){}
  applyTheme();
});

var NQ=16;
var NOSCORE={q1:1};                       /* context only, excluded from the readiness score */
var NSCORED=NQ-Object.keys(NOSCORE).length, MAX=NSCORED*5;
var K_ATT="gc.attempt.v2", K_MINE="gc.mine.v2";
function rj(k,f){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
var ARW='<svg class="arw" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var QTEXT=["Where does your company currently run its production workloads?",
"Who owns security and compliance in your company?",
"Do you have documented security policies?",
"Have you carried out a documented risk assessment?",
"Do you know what data you hold, where it lives and how sensitive it is?",
"How do people get access to your systems?",
"What happens when somebody joins or leaves?",
"How do you manage secrets, API keys and credentials?",
"How do you manage vendors and sub-processors?",
"How do code and infrastructure changes reach production?",
"How do you find and fix vulnerabilities?",
"Could you detect and respond to a security incident?",
"How mature is your backup and recovery capability?",
"Do your people receive security training?",
"How do you collect evidence that your controls are actually working?",
"If a customer asked for proof of your security posture tomorrow, what could you send them?"];


/* The ladder from the keynote. floor() because you have not reached a level
   until you are at it: 2.9 is still Repeatable, with Defined in sight. */
var LEVELS=[
 {n:1,name:"Ad Hoc",
  indicating:"key controls and processes are currently applied inconsistently and may rely heavily on individual knowledge and practices.",
  next:"The next step is to formalise, document, and consistently implement the core control framework across the organisation. Establishing this foundation will provide greater consistency and accountability, and create the basis for a meaningful SOC 2 Type 1 and ISO 27001 readiness assessment."},

 {n:2,name:"Developing",
  indicating:"core practices are in place and generally followed, but remain largely undocumented and unevidenced.",
  next:"The next step is to document the practices your teams already follow and begin collecting evidence consistently. Formalising this will demonstrate that controls operate reliably, and will substantially reduce the effort required for a SOC 2 Type 1 and ISO 27001 readiness assessment."},

 {n:3,name:"Defined",
  indicating:"controls are documented and applied consistently across the organisation.",
  next:"The next step is to close the remaining control gaps and establish structured evidence collection against each control. At this level SOC 2 Type 1 or ISO 27001 certification is a realistic objective, and a formal readiness assessment will confirm scope, effort, and timelines."},

 {n:4,name:"Managed",
  indicating:"controls are documented, measured, and supported by evidence.",
  next:"The next step is to validate control coverage against the relevant criteria and resolve any residual gaps ahead of audit. A formal readiness assessment will confirm scope, identify the remaining actions, and prepare the evidence set required for SOC 2 Type 1 or ISO 27001 certification."},

 {n:5,name:"Audit Ready",
  indicating:"controls are mature, consistently evidenced, and actively monitored.",
  next:"The next step is to confirm the audit scope and engage a certification body. Ongoing attention should focus on sustaining certification and maintaining a complete evidence set over time."}
];
function levelFor(m){ return LEVELS[Math.min(4,Math.max(0,Math.floor(m)-1))]; }
function ladderHTML(m){
  var lv=levelFor(m), pct=((m-1)/4)*100;
  var stops="";
  LEVELS.forEach(function(L){
    stops+='<span class="stop'+(L.n<=lv.n?" hit":"")+'"><b>'+L.n+'</b><span>'+L.name+'</span></span>';
  });
  return '<div class="ladder"><div class="stops">'+stops+'</div>'
    + '<div class="track"><i style="width:'+pct+'%"></i></div>'
    + '<div class="marker"><span class="pill" style="left:'+pct+'%">'+m.toFixed(1)+'</span></div></div>';
}
function standingHTML(m){
  var lv=levelFor(m);
  return '<div class="standing">'
    + '<h2>Current Maturity Level: '+lv.n+' \u2014 '+esc(lv.name)+'</h2>'
    + '<p>Your current readiness score is '+m.toFixed(1)+', indicating that '+esc(lv.indicating)+'</p>'
    + '<p>'+esc(lv.next)+'</p></div>';
}

function contactHTML(){
  var url =CONFIG.contactUrl    ||"https://www.genesesolution.com/contact-us/";
  var head=CONFIG.contactHeading||"Ready to strengthen your security and compliance readiness?";
  var text=CONFIG.contactText   ||"Learn more about ISO 27001 and SOC 2, understand what the next steps could look like, and speak with our team about your organisation\u2019s readiness.";
  return '<div class="contact"><div class="contact-copy">'
    + '<h2>'+esc(head)+'</h2><p>'+esc(text)+'</p></div>'
    + '<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener">Contact us '+ARW+'</a></div>';
}

/* Your own result only. It is read straight from this browser. This page never
   asks the server for anybody else, and the server has no way to list people. */
function mine(){
  var att=rj(K_ATT,null);
  if(att && att.id && att.answers && Object.keys(att.answers).length){
    return { id:att.id, name:att.name||"Anonymous", answers:att.answers,
             total:Object.keys(att.answers).reduce(function(s,k){ return NOSCORE[k]?s:s+att.answers[k]; },0),
             answered:Object.keys(att.answers).length };
  }
  var m=rj(K_MINE,{}), keys=Object.keys(m);
  if(!keys.length) return null;
  keys.sort(function(a,b){ return String(m[b].updatedAt||"").localeCompare(String(m[a].updatedAt||"")); });
  var r=m[keys[0]];
  return { id:keys[0], name:r.name, answers:r.answers||{}, total:r.total||0, answered:r.answered||0 };
}

var app=document.getElementById("app");
var me=mine();

if(!me || !me.answered){
  app.innerHTML='<h1 class="display">No readiness score yet.</h1>'
    + '<p class="lede">Take the '+NQ+'-question assessment and your readiness level appears here.</p>'
    + '<div class="acts"><a class="btn" href="'+esc(CONFIG.quizUrl||"index.html")+'">Start the assessment '+ARW+'</a></div>'
    + contactHTML();
} else if(me.answered < NQ){
  /* Incomplete: no maturity figure. An average over a subset is not an
     "overall" score, and it would reward answering only the easy questions. */
  var left=NQ-me.answered;
  app.innerHTML='<h1 class="display">Not finished yet.</h1>'
    + '<p class="lede">You have answered '+me.answered+' of '+NQ+' questions. '
    + 'Your readiness level appears once all '+NQ+' are answered.</p>'
    + '<div class="scale"><div class="segs">'
    +   (function(){ var h=""; for(var k=0;k<5;k++){
          var f=Math.max(0,Math.min(1,(me.answered/NQ)*5-k))*100;
          h+='<i><b style="width:'+f+'%"></b></i>'; } return h; })()
    + '</div><div class="ticks"><span>'+me.answered+' of '+NQ+' answered</span></div></div>'
    + '<div class="acts"><a class="btn" href="'+esc(CONFIG.quizUrl||"index.html")+'">'
    +   'Answer the last '+left+' question'+(left===1?'':'s')+' '+ARW+'</a></div>'
    + contactHTML();

} else {
  var t=me.total, m=t/NSCORED, lv=levelFor(m);
  var review="";
  for(var i=0;i<NQ;i++){
    review+='<li><span class="n2">'+(i+1)+'</span>'
      + '<span><span class="qt">'+esc(QTEXT[i])+'</span></span>'
      + '<span class="s">'+me.answers["q"+(i+1)]+'</span></li>';
  }
  app.innerHTML='<span class="bignum fig">'+m.toFixed(1)+'<em>/ 5</em></span>'
    + '<span class="bigsub">Your estimated readiness for SOC 2 Type 1 and ISO 27001</span>'
    + ladderHTML(m)
    + '<h1 class="display" style="margin-top:34px;max-width:20ch">'+esc(me.name)
    +   ', here is where you stand.</h1>'
    + standingHTML(m)
    + '<ol class="review">'+review+'</ol>'
    + contactHTML();
}

})();
</script>
</body>
</html>
